[package]
name = "customer-intake"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
forms-core = { version = "0.1.0", path = "../forms-core" }
lopdf = "0.44.0"
qrcode = "0.14.1"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
